
<div class="container mt-5">
    <h2 class="mb-4">Compare Insurance Documents</h2>
    
    {% if error %}
    <div class="alert alert-danger">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" enctype="multipart/form-data" class="mb-4">
        {% csrf_token %}
        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="upload1" class="form-label">Insurance Document 1</label>
                    <input type="file" class="form-control" id="upload1" name="upload1" required>
                </div>
            </div>
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="upload2" class="form-label">Insurance Document 2</label>
                    <input type="file" class="form-control" id="upload2" name="upload2" required>
                </div>
            </div>
        </div>
        
        <div class="mb-3">
            <label for="comparison_question" class="form-label">What would you like to know about these insurance plans?</label>
            <textarea class="form-control" id="comparison_question" name="comparison_question" rows="3" placeholder="Example: What are the differences in coverage for prescription medications?" required></textarea>
        </div>
        
        <button type="submit" class="btn btn-primary">Compare Documents</button>
    </form>

    {% if comparison_response %}
    <div class="card mt-4">
        <div class="card-header">
            <h5 class="mb-0">Comparison Results</h5>
            {% if question %}
            <small class="text-muted">Question: {{ question }}</small>
            {% endif %}
        </div>
        <div class="card-body">
            <pre class="comparison-response">{{ comparison_response }}</pre>
        </div>
    </div>
    {% endif %}
</div>

<style>
    .comparison-response {
        white-space: pre-wrap;
        font-family: inherit;
        background: none;
        border: none;
        padding: 0;
        margin: 0;
    }
</style>
