<!-- example/templates/index.html -->
<!DOCTYPE html>
<html>
  <head>
    <title>Medical Bill Breakdown</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        padding: 20px;
      }
      form {
        margin-bottom: 20px;
      }
      label {
        font-weight: bold;
        display: block;
        margin-top: 10px;
      }
      textarea {
        width: 100%;
        height: 100px;
        padding: 10px;
        font-size: 14px;
        border-radius: 5px;
        border: 1px solid #ccc;
      }
      input[type="file"] {
        display: block;
        margin-bottom: 10px;
      }
      button {
        padding: 10px 15px;
        font-size: 14px;
        cursor: pointer;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
      }
      button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <h1 style="text-align: center">Medical Bill Breakdown</h1>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <label for="upload">Upload Medical Bill:</label>
      <br />
      <input type="file" name="upload" />

      <label for="user_text">Enter your question:</label><br />
      <textarea
        name="user_text"
        id="user_text"
        rows="4"
        cols="50"
        placeholder="Type your question here..."
      ></textarea>
      <button type="submit">Submit</button>
    </form>
    {% if file_url %}
    <p>
      <strong
        >File uploaded successfully:
        <a href="{{ file_url }}">{{ file_url }}</a></strong
      >
    </p>
    {% endif %} {% if user_text %}
    <p><strong>You entered: {{ user_text }}</strong></p>
    {% endif %}
  </body>
</html>
